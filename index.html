<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RumbleXRietschans</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            
            /* Primary background with poster image and dark overlay */
            background-image: 
                linear-gradient(135deg, rgba(20, 20, 40, 0.85) 0%, rgba(40, 20, 60, 0.85) 100%),
                url('https://raw.githubusercontent.com/Rumbleevents/rumbleevents.github.io/main/Poster.png');
            
            background-size: 120%;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ticket-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.75) 0%, rgba(118, 75, 162, 0.75) 100%);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 280px;
            width: 75%;
            box-sizing: border-box;
            border: 1.5px solid rgba(200, 150, 255, 0.5);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #ffffff;
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .description {
            color: #f0f0f0;
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .price-tag {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(150, 100, 200, 0.6);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 3px solid #ffffff;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tikkie-button {
            display: block;
            background: linear-gradient(135deg, #9966cc 0%, #7a4ba3 100%);
            color: white;
            text-decoration: none;
            padding: 11px 20px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(153, 102, 204, 0.5);
            border: none;
            cursor: pointer;
            font-size: 13px;
        }

        .tikkie-button:hover {
            background: linear-gradient(135deg, #7a4ba3 0%, #6a3a93 100%);
            box-shadow: 0 6px 20px rgba(153, 102, 204, 0.7);
            transform: translateY(-2px);
        }

        .tikkie-button:active {
            transform: translateY(0);
        }

        .footer-note {
            font-size: 10px;
            color: #e0e0e0;
            margin-top: 12px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="ticket-card">
        <h1>RumbleXRietschans</h1>
        <p class="description">Leuk dat je erbij bent! Vul je gegevens in bij de betaling zodat we je op de gastenlijst kunnen zetten. Voor verdere wensen ook hier vermelden.</p>
        
        <div class="price-tag">
            Kies je bijdrage:
        </div>

        <div class="buttons-container">
            <a href="https://tikkie.me/pay/5bdrubhpjtdr5ko1rjff" target="_blank" class="tikkie-button">
                €15,- Bier en Fris
            </a>

            <a href="https://tikkie.me/pay/u0brhco8qq57kaopkvvn" target="_blank" class="tikkie-button">
                €7,50 Alleen Fris
            </a>
        </div>

        <p class="footer-note">Na betaling is je aanmelding definitief.</p>
    </div>

</body>
</html>
