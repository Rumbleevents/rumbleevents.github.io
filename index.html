<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RumbleXRietschans</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            
            /* Primary background with poster image and dark overlay */
            background-image: 
                linear-gradient(135deg, rgba(20, 20, 40, 0.85) 0%, rgba(40, 20, 60, 0.85) 100%),
                url('https://raw.githubusercontent.com/Rumbleevents/rumbleevents.github.io/main/Poster.png');
            
            background-size: 120%;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ticket-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.92) 0%, rgba(245, 247, 250, 0.92) 100%);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 350px;
            width: 85%;
            box-sizing: border-box;
            border: 2px solid rgba(0, 190, 245, 0.2);
        }

        h1 {
            color: #1a1a2e;
            margin: 0 0 12px 0;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #00bef5 0%, #0099cc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .description {
            color: #555;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .price-tag {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            background: linear-gradient(135deg, #e0f7ff 0%, #cce7ff 100%);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #00bef5;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tikkie-button {
            display: block;
            background: linear-gradient(135deg, #00bef5 0%, #009ecb 100%);
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 190, 245, 0.4);
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .tikkie-button:hover {
            background: linear-gradient(135deg, #009ecb 0%, #0077a3 100%);
            box-shadow: 0 8px 25px rgba(0, 190, 245, 0.6);
            transform: translateY(-2px);
        }

        .tikkie-button:active {
            transform: translateY(0);
        }

        .footer-note {
            font-size: 11px;
            color: #888;
            margin-top: 18px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="ticket-card">
        <h1>RumbleXRietschans</h1>
        <p class="description">Leuk dat je erbij bent! Vul je gegevens in bij de betaling zodat we je op de gastenlijst kunnen zetten. Voor verdere wensen ook hier vermelden.</p>
        
        <div class="price-tag">
            Kies je bijdrage:
        </div>

        <div class="buttons-container">
            <a href="https://tikkie.me/pay/5bdrubhpjtdr5ko1rjff" target="_blank" class="tikkie-button">
                €15,- Bier en Fris
            </a>

            <a href="https://tikkie.me/pay/u0brhco8qq57kaopkvvn" target="_blank" class="tikkie-button">
                €7,50 Alleen Fris
            </a>
        </div>

        <p class="footer-note">Na betaling is je aanmelding definitief.</p>
    </div>

</body>
</html>
