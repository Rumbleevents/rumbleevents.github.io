<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RumbleXRietschans</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;

            /* Primary background with poster image and dark overlay */
            background-image: 
                linear-gradient(135deg, rgba(20, 20, 40, 0.85) 0%, rgba(40, 20, 60, 0.85) 100%),
                url('https://raw.githubusercontent.com/Rumbleevents/rumbleevents.github.io/main/Poster.png');

            background-size: 120%;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ticket-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.75) 0%, rgba(118, 75, 162, 0.75) 100%);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 320px; /* Iets breder voor betere leesbaarheid en ruimte */
            width: 90%;       /* Schaalt nu mooier mee op mobiele schermen */
            box-sizing: border-box;
            border: 1.5px solid rgba(200, 150, 255, 0.5);
            backdrop-filter: blur(10px);
            margin: 20px 0;   /* Voorkomt dat de kaart op mobiel de schermrand raakt */
        }

        h1 {
            color: #ffffff;
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .event-date {
            font-size: 10px;
            color: #d0d0ff;
            margin-bottom: 12px;
            font-weight: 500;
        }
