<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RumbleXRietschans</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            
            /* Beautiful gradient background - no image needed */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ticket-card {
            background: linear-gradient(135deg, #ffffff 0%, #f5f7fa 100%);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-sizing: border-box;
            border: 2px solid rgba(102, 126, 234, 0.2);
        }

        h1 {
            color: #1a1a2e;
            margin: 0 0 15px 0;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .description {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .price-tag {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            background: linear-gradient(135deg, #e8eaf6 0%, #f3e5f5 100%);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tikkie-button {
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 16px 30px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .tikkie-button:hover {
            background: linear-gradient(135deg, #764ba2 0%, #5a3a8a 100%);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
            transform: translateY(-2px);
        }

        .tikkie-button:active {
            transform: translateY(0);
        }

        .footer-note {
            font-size: 12px;
            color: #888;
            margin-top: 25px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="ticket-card">
        <h1>RumbleXRietschans</h1>
        <p class="description">Leuk dat je erbij bent! Vul je gegevens in bij de betaling zodat we je op de gastenlijst kunnen zetten. Voor verdere wensen ook hier vermelden.</p>
        
        <div class="price-tag">
            Kies je bijdrage:
        </div>

        <div class="buttons-container">
            <a href="https://tikkie.me/pay/5bdrubhpjtdr5ko1rjff" target="_blank" class="tikkie-button">
                €15,- Bier en Fris
            </a>

            <a href="https://tikkie.me/pay/u0brhco8qq57kaopkvvn" target="_blank" class="tikkie-button">
                €7,50 Alleen Fris
            </a>
        </div>

        <p class="footer-note">Na betaling is je aanmelding definitief.</p>
    </div>

</body>
</html>
