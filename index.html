<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RumbleXRietschans</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            line-height: 1.6;
            
            /* Poster.PNG */
            background-image: linear-gradient(rgba(18, 18, 18, 0.75), rgba(18, 18, 18, 0.75)), url('https://raw.githubusercontent.com/Rumbleevents/rumbleevents.github.io/main/Poster.PNG');
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .ticket-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box; /* Zorgt dat padding de kaart niet te breed maakt */
            margin: 50px auto; /* Centreert de kaart netjes op het scherm */
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .price-tag {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            background: #edf2f7;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .tikkie-button {
            display: block; /* Veranderd naar block zodat ze netjes onder elkaar stapelen */
            background-color: #00bef5; /* Tikkie blauw/cyan */
            color: black;
            text-decoration: none;
            padding: 15px 30px;
            font-weight: bold;
            border-radius: 50px;
            transition: background 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 190, 245, 0.4);
            margin: 15px auto; /* Ruimte tussen de knoppen */
        }
        .tikkie-button:hover {
            background-color: #009ecb;
        }
        .footer-note {
            font-size: 11px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="ticket-card">
        <h1>RumbleXRietschans</h1>
        <p class="description">Leuk dat je erbij bent! Vul je gegevens in bij de betaling zodat we je op de gastenlijst kunnen zetten.
            Voor verdere wensen ook hier vermelden.</p>
        
        <div class="price-tag">
            Kies je bijdrage:
        </div>

        <a href="https://tikkie.me/pay/5bdrubhpjtdr5ko1rjff" target="_blank" class="tikkie-button">
            €15,- Bier en Fris
        </a>

        <a href="https://tikkie.me/pay/u0brhco8qq57kaopkvvn" target="_blank" class="tikkie-button">
            €7,50 Alleen Fris
        </a>

        <p class="footer-note">Na betaling is je aanmelding definitief.</p>
    </div>

</body>
</html>
