<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belangrijke Info - RumbleXRietschans</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;

            /* Zelfde achtergrond en verloop als de hoofdpagina */
            background-image: 
                linear-gradient(135deg, rgba(20, 20, 40, 0.85) 0%, rgba(40, 20, 60, 0.85) 100%),
                url('https://raw.githubusercontent.com/Rumbleevents/rumbleevents.github.io/main/Poster.png');

            background-size: 120%;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.75) 0%, rgba(118, 75, 162, 0.75) 100%);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-sizing: border-box;
            border: 1.5px solid rgba(200, 150, 255, 0.5);
            backdrop-filter: blur(10px);
            margin: 20px 0;
        }

        h1 {
            color: #ffffff;
            margin: 0 0 20px 0;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .info-section {
            background: rgba(150, 100, 200, 0.4);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: left;
        }

        .info-title {
            font-size: 11px;
            color: #e0e0ff;
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-content {
            color: #ffffff;
            font-size: 13px;
            margin: 0;
        }

        .back-button {
            display: block;
            background: linear-gradient(135deg, #9966cc 0%, #7a4ba3 100%);
            color: white;
            text-decoration: none;
            padding: 11px 20px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(153, 102, 204, 0.5);
            border: none;
            font-size: 13px;
            margin-top: 20px;
            text-align: center;
        }

        .back-button:hover {
            background: linear-gradient(135deg, #7a4ba3 0%, #6a3a93 100%);
            box-shadow: 0 6px 20px rgba(153, 102, 204, 0.7);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="info-card">
        <h1>Belangrijke info</h1>

        <div class="info-section">
            <div class="info-title">Datum & Tijd</div>
            <p class="info-content">Zaterdag 4 juli 2026<br>15:00 - 00:00 uur</p>
        </div>

        <div class="info-section">
            <div class="info-title">Locatie</div>
            <p class="info-content">Rietschans 71, Leiderdorp</p>
        </div>

        <div class="info-section">
            <div class="info-title">Tickets</div>
            <p class="info-content">De tickets zijn een eigen bijdrage om het feest te kunnen realiseren.</p>
        </div>

        <div class="info-section">
            <div class="info-title">Music Genres</div>
            <p class="info-content">House, Drum and Bass & Techno</p>
        </div>

        <a href="index.html" class="back-button">Terug naar aanmelden</a>
    </div>

</body>
</html>
